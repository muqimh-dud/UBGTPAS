<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MUSABX Browser</title>

<style>

:root {
    --bg:#080f1f;
    --card:#111827;
    --accent:#38bdf8;
    --text:#e5e7eb;
}

*{
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    margin:0;
    height:100vh;

    background:
    radial-gradient(circle at top,#1e3a8a,#080f1f 60%);

    color:var(--text);

    display:flex;
    justify-content:center;
    align-items:center;

}


.browser{

    width:95%;
    height:95vh;
    max-width:1200px;

    background:var(--card);

    border-radius:25px;

    padding:20px;

    box-shadow:0 0 40px black;

}



.top{

    display:flex;
    gap:10px;

}



input{

    flex:1;

    padding:15px;

    border:none;

    border-radius:12px;

    background:#1f2937;

    color:white;

    font-size:16px;

}



button{

    border:none;

    border-radius:12px;

    padding:12px 15px;

    background:var(--accent);

    color:black;

    font-weight:bold;

    cursor:pointer;

}


button:hover{

    opacity:.8;

}



.controls{

    margin-top:10px;

    display:flex;

    gap:10px;

    flex-wrap:wrap;

}



iframe{

    width:100%;

    height:calc(100% - 150px);

    margin-top:15px;

    border:none;

    border-radius:15px;

    background:white;

}



.logo{

    text-align:center;

    font-size:32px;

    font-weight:bold;

    color:var(--accent);

}



.loading{

    display:none;

    text-align:center;

    margin-top:5px;

}


.fullscreen{

    position:fixed;

    inset:0;

    width:100%;

    height:100%;

    border-radius:0;

    z-index:999;

}


</style>

</head>


<body>


<div class="browser" id="browserBox">


<div class="logo">
🚀 MUSABX
</div>


<div class="top">


<input

id="url"

placeholder="Search or enter website..."

autocomplete="off"

/>


<button onclick="openSite()">
GO
</button>


</div>


<div class="controls">


<button onclick="backPage()">
⬅
</button>


<button onclick="forwardPage()">
➡
</button>


<button onclick="reloadPage()">
🔄
</button>


<button onclick="homePage()">
🏠
</button>


<button onclick="toggleFullscreen()">
⛶
</button>


<button onclick="toggleDark()">
🌙
</button>


</div>


<div class="loading" id="loading">
Loading...
</div>


<iframe id="viewer"></iframe>



</div>





<script>


const WORKER_URL =
"https://musabx-proxy.muqimh.workers.dev";


const frame =
document.getElementById("viewer");


const input =
document.getElementById("url");


const loading =
document.getElementById("loading");


const box =
document.getElementById("browserBox");





function openSite(){


let value =
input.value.trim();



if(value==="") return;



let target;



// Website detection

if(
value.includes(".") &&
!value.includes(" ")
){

    if(
    !value.startsWith("http://") &&
    !value.startsWith("https://")
    ){

        value="https://"+value;

    }


    target=value;


}

else{


    target =
    "https://www.google.com/search?q="
    +
    encodeURIComponent(value);


}



load(target);


}





function load(url){


loading.style.display="block";


frame.src =
WORKER_URL
+
"/proxy?url="
+
encodeURIComponent(url);



frame.onload=function(){

loading.style.display="none";

};


}





input.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

openSite();

}

});





function backPage(){

try{

frame.contentWindow.history.back();

}catch(e){}

}



function forwardPage(){

try{

frame.contentWindow.history.forward();

}catch(e){}

}



function reloadPage(){

frame.src=frame.src;

}



function homePage(){

load("https://www.google.com");

}





function toggleFullscreen(){


if(!document.fullscreenElement){

box.requestFullscreen();

}

else{

document.exitFullscreen();

}


}




function toggleDark(){


document.body.classList.toggle("light");


}





</script>


</body>

</html>
