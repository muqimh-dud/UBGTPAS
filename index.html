<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MUSABX Proxy</title>

<style>
:root {
    color-scheme: dark;
    --accent:#38bdf8;
    --text:#e5e7eb;
}

* {
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body {
    margin:0;
    min-height:100vh;
    background:radial-gradient(circle at top,#1e3a8a,#080f1f 50%);
    color:var(--text);
    display:flex;
    justify-content:center;
    align-items:center;
}

.container {
    width:95%;
    max-width:900px;
    background:#111827;
    padding:30px;
    border-radius:25px;
    box-shadow:0 0 40px black;
}

.logo {
    text-align:center;
    font-size:40px;
    font-weight:bold;
    color:var(--accent);
}

.subtitle {
    text-align:center;
    opacity:.7;
    margin-bottom:25px;
}

.search {
    display:flex;
    gap:10px;
}

input {
    flex:1;
    padding:15px;
    border-radius:12px;
    border:none;
    background:#1f2937;
    color:white;
    font-size:16px;
}

button {
    padding:14px 18px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:#38bdf8;
    color:black;
    font-weight:bold;
}

button:hover {
    opacity:.8;
}

.controls {
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

iframe {
    width:100%;
    height:500px;
    margin-top:20px;
    border:none;
    border-radius:15px;
    background:white;
}

.footer {
    text-align:center;
    margin-top:20px;
    opacity:.6;
    font-size:13px;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">
🚀 MUSABX
</div>

<div class="subtitle">
Cloudflare Proxy Browser
</div>


<div class="search">

<input 
id="url"
placeholder="Enter website (example.com)"
>

<button onclick="openSite()">
OPEN
</button>

</div>


<div class="controls">

<button onclick="backPage()">⬅ Back</button>

<button onclick="forwardPage()">Forward ➡</button>

<button onclick="reloadPage()">🔄 Reload</button>

<button onclick="homePage()">🏠 Home</button>

</div>


<iframe id="browser"></iframe>


<div class="footer">
MUSABX Proxy • Powered by Cloudflare Worker
</div>


</div>


<script>

const frame = document.getElementById("browser");
const input = document.getElementById("url");


// YOUR CLOUDFLARE WORKER
const WORKER_URL = "https://musabx-proxy.muqimh.workers.dev";


function openSite(){

    let url = input.value.trim();


    if(url === ""){
        alert("Enter a website first");
        return;
    }


    if(!url.startsWith("http://") &&
       !url.startsWith("https://")){

        url = "https://" + url;

    }


    frame.src =
    WORKER_URL +
    "/proxy?url=" +
    encodeURIComponent(url);

}



input.addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        openSite();
    }

});



function backPage(){

    try{
        frame.contentWindow.history.back();
    }
    catch(e){}

}



function forwardPage(){

    try{
        frame.contentWindow.history.forward();
    }
    catch(e){}

}



function reloadPage(){

    frame.src = frame.src;

}



function homePage(){

    frame.src =
    WORKER_URL +
    "/proxy?url=" +
    encodeURIComponent("https://example.com");

}


</script>


</body>
</html>
