<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MUSABX Proxy</title>

<style>

:root {
    color-scheme: dark;
    --bg: #080f1f;
    --card: #111827;
    --accent: #38bdf8;
    --text: #e5e7eb;
    --button: #38bdf8;
}


* {
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}


body {
    margin: 0;
    min-height: 100vh;
    background:
    radial-gradient(circle at top,#1e3a8a,#080f1f 50%);
    color: var(--text);

    display:flex;
    justify-content:center;
    align-items:center;
}


.container {

    width:95%;
    max-width:900px;

    background:rgba(17,24,39,.95);

    padding:30px;

    border-radius:25px;

    box-shadow:
    0 0 40px rgba(0,0,0,.7);

}


.logo {

    text-align:center;

    font-size:40px;

    font-weight:bold;

    color:var(--accent);

}


.subtitle {

    text-align:center;

    opacity:.7;

    margin-bottom:25px;

}



.search {

    display:flex;

    gap:10px;

}


input {

    flex:1;

    padding:15px;

    border-radius:12px;

    border:none;

    background:#1f2937;

    color:white;

    font-size:16px;

    outline:none;

}



button {

    padding:14px 18px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    background:var(--button);

    color:black;

    font-weight:bold;

}


button:hover {

    opacity:.8;

}



.controls {

    display:flex;

    gap:10px;

    margin-top:15px;

}



iframe {

    width:100%;

    height:500px;

    margin-top:20px;

    border-radius:15px;

    border:none;

    background:white;

}



.footer {

    text-align:center;

    margin-top:20px;

    font-size:13px;

    opacity:.6;

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
🚀 MUSABX
</div>


<div class="subtitle">
Fast Web Viewer
</div>



<div class="search">

<input
id="url"
placeholder="Enter website (example.com)"
autocomplete="off"
>


<button onclick="openSite()">
OPEN
</button>


</div>




<div class="controls">


<button onclick="backPage()">
⬅ Back
</button>


<button onclick="forwardPage()">
Forward ➡
</button>


<button onclick="reloadPage()">
🔄 Reload
</button>


<button onclick="homePage()">
🏠 Home
</button>


</div>




<iframe id="browser"></iframe>




<div class="footer">

MUSABX Proxy • GitHub Pages Edition

</div>


</div>





<script>


const frame =
document.getElementById("browser");


const input =
document.getElementById("url");



function openSite(){


let url =
input.value.trim();



if(url === ""){

alert("Enter a website first");

return;

}



if(!url.startsWith("http://") &&
!url.startsWith("https://")){


url =
"https://" + url;


}



frame.src=url;


}




input.addEventListener(
"keydown",
function(event){


if(event.key==="Enter"){

openSite();

}


});





function backPage(){


try{

frame.contentWindow.history.back();

}

catch(e){}


}




function forwardPage(){


try{

frame.contentWindow.history.forward();

}

catch(e){}


}




function reloadPage(){


try{

frame.contentWindow.location.reload();

}

catch(e){}


}




function homePage(){


frame.src="https://www.google.com";

}



</script>



</body>

</html>
