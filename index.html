<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MUSABX v2</title>


<style>

/* =========================
   MUSABX CORE STYLE
========================= */


*{
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}


body{

    margin:0;
    height:100vh;

    background:
    radial-gradient(circle at top,#2563eb,#020617);

    color:white;

    overflow:hidden;

}



#app{

    height:100vh;
    width:100%;

    display:flex;
    flex-direction:column;

}



/* =========================
   TOP BAR
========================= */


.topbar{

    height:65px;

    display:flex;

    align-items:center;

    gap:10px;

    padding:10px;

    background:#111827;

    box-shadow:0 5px 20px black;

}



.logo{

    font-size:28px;

    font-weight:bold;

    color:#38bdf8;

}



.urlbar{

    flex:1;

    display:flex;

    gap:8px;

}



input{

    flex:1;

    padding:12px;

    border-radius:12px;

    border:none;

    outline:none;

    background:#1f2937;

    color:white;

    font-size:16px;

}



button{

    padding:10px 14px;

    border:none;

    border-radius:10px;

    background:#38bdf8;

    color:black;

    font-weight:bold;

    cursor:pointer;

}



button:hover{

    opacity:.8;

}




/* =========================
   TABS
========================= */


.tabs{

    height:45px;

    display:flex;

    gap:8px;

    align-items:center;

    padding:5px;

    background:#020617;

}



.tab{

    background:#1f2937;

    padding:8px 15px;

    border-radius:10px;

    cursor:pointer;

}



.tab.active{

    background:#38bdf8;

    color:black;

}



.newtab{

    background:#22c55e;

}





/* =========================
   MAIN AREA
========================= */


.main{

    flex:1;

    display:flex;

}



.sidebar{

    width:220px;

    background:#111827;

    padding:15px;

}



.sidebar h3{

    margin-top:0;

}



.appbutton{

    width:100%;

    margin-bottom:10px;

}



.viewer{

    flex:1;

}



iframe{

    width:100%;

    height:100%;

    border:none;

    background:white;

}





/* =========================
   BOTTOM
========================= */


.bottom{

    height:40px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:10px;

    background:#111827;

}





/* =========================
   PANELS
========================= */


.panel{

    position:fixed;

    top:80px;

    right:20px;

    width:300px;

    padding:20px;

    background:#111827;

    border-radius:15px;

    box-shadow:0 0 30px black;

    display:none;

}



.item{

    background:#1f2937;

    padding:10px;

    border-radius:10px;

    margin-bottom:8px;

}





/* =========================
   LOADING
========================= */


#loading{

    position:fixed;

    top:50%;

    left:50%;

    transform:translate(-50%,-50%);

    background:#111827;

    padding:20px;

    border-radius:15px;

    display:none;

    z-index:999;

}




/* =========================
   EXTRA EFFECTS
========================= */


button{

    transition:.2s;

}



button:active{

    transform:scale(.95);

}



.tab{

    transition:.2s;

}



.tab:hover{

    transform:translateY(-2px);

}



.light{

    background:white;

    color:black;

}



.light .topbar,
.light .sidebar,
.light .bottom,
.light .panel{

    background:#e5e7eb;

}



@keyframes pulse{

    50%{

        opacity:.5;

    }

}



#loading{

    animation:pulse 1s infinite;

}


</style>


</head>


<body>


<div id="app">


<div class="topbar">


<div class="logo">
🚀 MUSABX
</div>



<div class="urlbar">

<input
id="url"
placeholder="Search or enter website..."
>


<button onclick="go()">
GO
</button>


</div>



<button onclick="back()">
⬅
</button>


<button onclick="forward()">
➡
</button>


<button onclick="reload()">
🔄
</button>


<button onclick="toggleFullscreen()">
⛶
</button>


<button onclick="openSettings()">
⚙
</button>


</div>



<div class="tabs" id="tabs">

<div class="tab active">
Tab 1
</div>


<button class="newtab" onclick="newTab()">
+
</button>


</div>


<div class="main">


<div class="sidebar">


<h3>
Apps
</h3>


<button class="appbutton" onclick="openApp('https://youtube.com')">
🎬 YouTube
</button>


<button class="appbutton" onclick="openApp('https://tiktok.com')">
🎵 TikTok
</button>


<button class="appbutton" onclick="openApp('https://poki.com')">
🎮 Poki
</button>


<button class="appbutton" onclick="home()">
🔎 Search
</button>


<hr>


<button class="appbutton" onclick="openHistory()">
🕘 History
</button>


<button class="appbutton" onclick="openBookmarks()">
⭐ Bookmarks
</button>


</div>


<div class="viewer">

<iframe id="frame"></iframe>

</div>


</div>


<div class="bottom">

<div>
MUSABX v2 🚀
</div>

<div id="clock">
</div>

</div>


</div>



<div id="loading">
Loading...
</div>



<div class="panel" id="settings">

<h2>
Settings
</h2>

<button onclick="toggleTheme()">
🌙 Toggle Theme
</button>

</div>



<div class="panel" id="history">

<h2>
History
</h2>

<div id="historyList">
</div>

</div>



<div class="panel" id="bookmarks">

<h2>
Bookmarks
</h2>

<div id="bookmarkList">
</div>

</div>

   <script>


// =========================
// MUSABX CONFIG
// =========================


const WORKER_URL =
"https://musabx-proxy.muqimh.workers.dev";


const frame =
document.getElementById("frame");


const url =
document.getElementById("url");


const loading =
document.getElementById("loading");



let historyData =
JSON.parse(
localStorage.getItem("musabx_history")
) || [];



let bookmarks =
JSON.parse(
localStorage.getItem("musabx_bookmarks")
) || [];



let tabs = [
"https://html.duckduckgo.com/html/"
];


let currentTab = 0;






// =========================
// LOAD WEBSITE
// =========================


function loadPage(site){


loading.style.display="block";


frame.src =
WORKER_URL +
"/proxy?url=" +
encodeURIComponent(site);



historyData.push(site);



localStorage.setItem(
"musabx_history",
JSON.stringify(historyData)
);



setTimeout(()=>{

loading.style.display="none";

},3000);


}







// =========================
// SEARCH BAR
// =========================


function go(){


let value =
url.value.trim();



if(value===""){

return;

}



let target;



// Website detection

if(
value.includes(".") &&
!value.includes(" ")
){


if(
!value.startsWith("http://") &&
!value.startsWith("https://")
){

value =
"https://" + value;

}


target=value;


}


// Search

else{


target =
"https://html.duckduckgo.com/html/?q="
+
encodeURIComponent(value);


}



tabs[currentTab]=target;


loadPage(target);


}






url.addEventListener(
"keydown",
function(e){


if(e.key==="Enter"){

go();

}


});







// =========================
// CONTROLS
// =========================


function back(){


try{

frame.contentWindow.history.back();

}

catch(e){}


}




function forward(){


try{

frame.contentWindow.history.forward();

}

catch(e){}


}





function reload(){


frame.src =
frame.src;


}





function home(){


loadPage(
"https://html.duckduckgo.com/html/"
);


}





function openApp(site){

loadPage(site);

}








// =========================
// TABS
// =========================


function newTab(){


tabs.push(
"https://html.duckduckgo.com/html/"
);


currentTab =
tabs.length-1;



createTabs();



home();


}







function createTabs(){


const box =
document.getElementById("tabs");



box.innerHTML="";



tabs.forEach(
(site,index)=>{


let tab =
document.createElement("div");



tab.className =
"tab " +
(index===currentTab ? "active":"");



tab.innerHTML =
"Tab " + (index+1);



tab.onclick=function(){


currentTab=index;


loadPage(
tabs[index]
);



createTabs();


};



box.appendChild(tab);



});




let add =
document.createElement("button");


add.className =
"newtab";


add.innerHTML="+";


add.onclick =
newTab;



box.appendChild(add);



}







// =========================
// HISTORY
// =========================


function openHistory(){


closePanels();



let panel =
document.getElementById("history");



panel.style.display="block";



let list =
document.getElementById("historyList");



list.innerHTML="";



historyData
.slice(-20)
.reverse()
.forEach(site=>{


let item =
document.createElement("div");


item.className="item";


item.innerHTML =
site;



item.onclick=function(){

loadPage(site);

};



list.appendChild(item);



});


}







// =========================
// BOOKMARKS
// =========================


function saveBookmark(){


let page =
frame.src;



bookmarks.push(page);



localStorage.setItem(
"musabx_bookmarks",
JSON.stringify(bookmarks)
);



alert(
"Saved ⭐"
);


}





function openBookmarks(){


closePanels();



let panel =
document.getElementById("bookmarks");



panel.style.display="block";



let list =
document.getElementById("bookmarkList");



list.innerHTML="";



bookmarks.forEach(site=>{


let item =
document.createElement("div");


item.className="item";


item.innerHTML =
site;



item.onclick=function(){

loadPage(site);

};



list.appendChild(item);



});


}







// =========================
// SETTINGS
// =========================


function openSettings(){


closePanels();



document
.getElementById("settings")
.style.display="block";


}





function closePanels(){


document
.querySelectorAll(".panel")
.forEach(panel=>{


panel.style.display="none";


});


}







function toggleTheme(){


document.body.classList.toggle(
"light"
);


}








// =========================
// FULLSCREEN
// =========================


function toggleFullscreen(){


if(!document.fullscreenElement){


document
.getElementById("app")
.requestFullscreen();


}

else{


document.exitFullscreen();


}


}







// =========================
// CLOCK
// =========================


function updateClock(){


document.getElementById("clock")
.innerHTML =
new Date()
.toLocaleTimeString();


}



setInterval(
updateClock,
1000
);



updateClock();






// =========================
// KEYBOARD SHORTCUTS
// =========================


document.addEventListener(
"keydown",
function(e){


if(
e.ctrlKey &&
e.key==="l"
){

e.preventDefault();

url.focus();

}



if(
e.altKey &&
e.key==="ArrowLeft"
){

back();

}



if(
e.altKey &&
e.key==="ArrowRight"
){

forward();

}



});






// START MUSABX


createTabs();


loadPage(
"https://html.duckduckgo.com/html/"
);



</script>
<style>

/* =========================
   FINAL MUSABX POLISH
========================= */


.appbutton{

transition:.25s;

}



.appbutton:hover{

transform:translateX(8px);

}



#loading{

font-weight:bold;

}



</style>


<script>


// =========================
// SAVE BUTTON
// =========================


let saveButton =
document.createElement("button");


saveButton.innerHTML =
"⭐ Save";


saveButton.onclick =
saveBookmark;



document
.querySelector(".topbar")
.appendChild(saveButton);






// =========================
// PLACEHOLDER ROTATION
// =========================


let tips = [

"Search anything...",

"Try YouTube",

"Try TikTok",

"Try Poki games",

"Enter a website"

];


let tipIndex=0;



setInterval(()=>{


url.placeholder =
tips[tipIndex];



tipIndex++;



if(tipIndex>=tips.length){

tipIndex=0;

}



},3000);






// =========================
// FRAME LOADING
// =========================


frame.onload=function(){


loading.style.display="none";


};






// =========================
// MOBILE SUPPORT
// =========================


function mobileCheck(){


if(window.innerWidth < 700){


document.querySelector(".sidebar")
.style.width="120px";



document.querySelector(".logo")
.style.fontSize="20px";


}


}



window.addEventListener(
"resize",
mobileCheck
);



mobileCheck();






// =========================
// WELCOME MESSAGE
// =========================


console.log(
"MUSABX v2 READY 🚀"
);



</script>


</body>

</html>
