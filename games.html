```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#040814">

  <title>MUSABX — Games</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .games-page {
      min-height: 100vh;
      padding: 20px;
    }

    .games-shell {
      width: min(1200px, 100%);
      margin: 0 auto;
    }

    .games-header {
      padding: 24px;
      margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      background: rgba(255,255,255,.045);
      box-shadow: 0 20px 60px rgba(0,0,0,.28);
      backdrop-filter: blur(18px);
    }

    .games-title {
      margin: 0;
      color: #61dafb;
      font-size: clamp(2rem, 5vw, 3.5rem);
      letter-spacing: .04em;
    }

    .games-subtitle {
      margin: 8px 0 0;
      color: #a6b8d7;
      line-height: 1.6;
    }

    .games-tools {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .game-search {
      flex: 1;
      min-width: 220px;
      height: 46px;
      padding: 0 16px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px;
      outline: none;
      background: rgba(255,255,255,.06);
      color: #eef5ff;
      font-size: 15px;
    }

    .game-search:focus {
      border-color: rgba(97,218,251,.55);
    }

    .category-list {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 12px;
      scrollbar-width: thin;
    }

    .category-button {
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 999px;
      padding: 10px 15px;
      background: rgba(255,255,255,.05);
      color: #a6b8d7;
      cursor: pointer;
      transition: .2s ease;
    }

    .category-button:hover {
      background: rgba(97,218,251,.1);
      color: #eef5ff;
    }

    .category-button.active {
      border-color: rgba(97,218,251,.4);
      background: rgba(97,218,251,.13);
      color: #61dafb;
    }

    .games-count {
      margin: 10px 0 16px;
      color: #8195b5;
      font-size: 14px;
    }

    .game-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      background: rgba(255,255,255,.045);
      box-shadow: 0 15px 45px rgba(0,0,0,.2);
      transition:
        transform .2s ease,
        border-color .2s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: rgba(97,218,251,.28);
    }

    .game-cover {
      min-height: 135px;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(
          circle at 30% 20%,
          rgba(97,218,251,.25),
          transparent 50%
        ),
        rgba(0,0,0,.2);
      font-size: 52px;
    }

    .game-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px;
      flex: 1;
    }

    .game-name {
      margin: 0;
      color: #eef5ff;
      font-size: 18px;
    }

    .game-description {
      margin: 0;
      color: #91a6c7;
      line-height: 1.5;
      font-size: 14px;
      flex: 1;
    }

    .game-category {
      color: #61dafb;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .1em;
    }

    .game-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .play-button,
    .favorite-button {
      min-height: 42px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .play-button {
      flex: 1;
      background: linear-gradient(
        135deg,
        #61dafb,
        #4dd0e1
      );
      color: #07121d;
    }

    .favorite-button {
      width: 44px;
      background: rgba(255,255,255,.07);
      color: #eef5ff;
      font-size: 18px;
    }

    .favorite-button.active {
      color: #61dafb;
      background: rgba(97,218,251,.12);
    }

    .empty-games {
      padding: 50px 20px;
      text-align: center;
      border: 1px dashed rgba(255,255,255,.12);
      border-radius: 20px;
      color: #91a6c7;
    }

    .game-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      padding: 15px;
      background: rgba(0,0,0,.82);
      backdrop-filter: blur(8px);
    }

    .game-modal.open {
      display: grid;
      place-items: center;
    }

    .game-window {
      width: min(900px, 100%);
      max-height: 95vh;
      overflow: auto;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 22px;
      background: #07101e;
      box-shadow: 0 30px 100px rgba(0,0,0,.5);
    }

    .game-window-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .game-window-title {
      margin: 0;
      color: #eef5ff;
    }

    .close-game {
      min-width: 42px;
      min-height: 42px;
      border: 0;
      border-radius: 12px;
      background: rgba(255,255,255,.07);
      color: #fff;
      cursor: pointer;
      font-size: 18px;
    }

    .game-stage {
      padding: 18px;
    }

    .game-canvas {
      display: block;
      width: 100%;
      max-width: 800px;
      height: auto;
      margin: 0 auto;
      border-radius: 16px;
      background: #030711;
      touch-action: none;
    }

    .game-help {
      margin: 12px auto 0;
      max-width: 800px;
      color: #91a6c7;
      line-height: 1.5;
      text-align: center;
      font-size: 14px;
    }

    .mobile-controls {
      display: none;
      justify-content: center;
      gap: 10px;
      margin: 15px auto 0;
    }

    .mobile-controls button {
      width: 62px;
      height: 52px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px;
      background: rgba(255,255,255,.07);
      color: #eef5ff;
      font-size: 20px;
      touch-action: manipulation;
    }

    @media (max-width: 700px) {
      .games-page {
        padding: 10px;
      }

      .games-header {
        padding: 18px;
      }

      .game-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .game-cover {
        min-height: 100px;
        font-size: 40px;
      }

      .game-info {
        padding: 12px;
      }

      .game-name {
        font-size: 15px;
      }

      .game-description {
        font-size: 12px;
      }

      .mobile-controls {
        display: flex;
      }
    }

    @media (max-width: 430px) {
      .game-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<main class="games-page">
  <div class="games-shell">

    <header class="games-header">

      <h1 class="games-title">MUSABX GAMES</h1>

      <p class="games-subtitle">
        Different games. Different challenges.
        Pick a category and play.
      </p>

      <div class="games-tools">

        <input
          id="gameSearch"
          class="game-search"
          type="search"
          placeholder="Search games..."
          autocomplete="off"
          spellcheck="false"
        >

      </div>

      <nav
        id="categoryList"
        class="category-list"
        aria-label="Game categories"
      ></nav>

    </header>

    <div
      id="gamesCount"
      class="games-count"
    ></div>

    <section
      id="gameGrid"
      class="game-grid"
      aria-live="polite"
    ></section>

  </div>
</main>

<div
  id="gameModal"
  class="game-modal"
  aria-hidden="true"
>
  <section class="game-window">

    <header class="game-window-header">

      <h2
        id="gameWindowTitle"
        class="game-window-title"
      >
        Game
      </h2>

      <button
        id="closeGame"
        class="close-game"
        type="button"
        aria-label="Close game"
      >×</button>

    </header>

    <div class="game-stage">

      <canvas
        id="gameCanvas"
        class="game-canvas"
        width="800"
        height="500"
      ></canvas>

      <p
        id="gameHelp"
        class="game-help"
      ></p>

      <div
        id="mobileControls"
        class="mobile-controls"
      >
        <button type="button" data-control="left">←</button>
        <button type="button" data-control="jump">↑</button>
        <button type="button" data-control="right">→</button>
        <button type="button" data-control="action">●</button>
      </div>

    </div>

  </section>
</div>

<script src="app.js"></script>
<script src="games.js"></script>

</body>
</html>
```
