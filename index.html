<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MUSABX Browser</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    margin:0;
    height:100vh;
    background:
    radial-gradient(circle at top,#1e3a8a,#080f1f 60%);
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;
}


.browser{

    width:95%;
    height:95vh;

    background:#111827;

    border-radius:25px;

    padding:20px;

    box-shadow:0 0 40px black;

}



.logo{

    text-align:center;

    font-size:38px;

    font-weight:bold;

    color:#38bdf8;

    margin-bottom:15px;

}



.top{

    display:flex;

    gap:10px;

}



input{

    flex:1;

    padding:15px;

    border:none;

    border-radius:12px;

    background:#1f2937;

    color:white;

    font-size:16px;

    outline:none;

}



button{

    padding:12px 16px;

    border:none;

    border-radius:12px;

    background:#38bdf8;

    color:black;

    font-weight:bold;

    cursor:pointer;

}



button:hover{

    opacity:.8;

}



.controls{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

    margin-top:12px;

}



.loading{

    display:none;

    text-align:center;

    color:#38bdf8;

    margin:10px;

}



iframe{

    width:100%;

    height:calc(100% - 170px);

    margin-top:10px;

    border:none;

    border-radius:15px;

    background:white;

}



.fullscreen{

    position:fixed;

    top:0;

    left:0;

    width:100vw;

    height:100vh;

    z-index:9999;

    border-radius:0;

}


</style>

</head>


<body>


<div class="browser" id="browserBox">


<div class="logo">
🚀 MUSABX
</div>



<div class="top">


<input
id="url"
placeholder="Search or enter website..."
autocomplete="off"
>


<button onclick="openSite()">
GO
</button>


</div>



<div class="controls">


<button onclick="backPage()">
⬅
</button>


<button onclick="forwardPage()">
➡
</button>


<button onclick="reloadPage()">
🔄
</button>


<button onclick="homePage()">
🏠
</button>


<button onclick="toggleFullscreen()">
⛶
</button>


</div>



<div class="loading" id="loading">
Loading...
</div>



<iframe id="viewer"></iframe>



</div>





<script>


const WORKER_URL =
"https://musabx-proxy.muqimh.workers.dev";


const frame =
document.getElementById("viewer");


const input =
document.getElementById("url");


const loading =
document.getElementById("loading");


const box =
document.getElementById("browserBox");





function openSite(){


let value =
input.value.trim();



if(value===""){

return;

}



let target;



// Open websites directly

if(
value.includes(".") &&
!value.includes(" ")
){


if(
!value.startsWith("http://") &&
!value.startsWith("https://")
){

value =
"https://" + value;

}


target=value;


}


// Search normal words

else{


target =
"https://www.google.com/search?q="
+
encodeURIComponent(value);


}



loadPage(target);


}





function loadPage(target){


loading.style.display="block";



frame.src =
WORKER_URL
+
"/proxy?url="
+
encodeURIComponent(target);



frame.onload=function(){

loading.style.display="none";

};


}





input.addEventListener(
"keydown",
function(e){


if(e.key==="Enter"){

openSite();

}


});





function backPage(){

try{

frame.contentWindow.history.back();

}

catch(e){}

}




function forwardPage(){

try{

frame.contentWindow.history.forward();

}

catch(e){}

}




function reloadPage(){

frame.src=frame.src;

}





function homePage(){

loadPage("https://www.google.com");

}





function toggleFullscreen(){


if(!document.fullscreenElement){

box.requestFullscreen();

}

else{

document.exitFullscreen();

}


}



</script>


</body>

</html>
