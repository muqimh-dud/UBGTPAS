<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MUSABX Proxy</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --panel: rgba(16, 27, 46, 0.95);
      --panel-soft: rgba(17, 30, 49, 0.8);
      --accent: #61dafb;
      --accent-strong: #4dd0e1;
      --text: #eef5ff;
      --muted: #a6b8d7;
      --border: rgba(255, 255, 255, 0.08);
      --shadow: 0 22px 60px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, rgba(97, 218, 251, 0.18), transparent 35%),
                  radial-gradient(circle at bottom right, rgba(111, 181, 255, 0.12), transparent 28%),
                  #040814;
      color: var(--text);
    }

    .app-shell {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
      gap: 1rem;
      padding: 1rem;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 1rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--panel-soft);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: grid;
      gap: 0.3rem;
    }

    .brand strong {
      font-size: 1.2rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .brand span {
      color: var(--muted);
      font-size: 0.94rem;
    }

    .search-group {
      display: grid;
      gap: 0.75rem;
      width: min(100%, 100%);
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem;
      width: 100%;
    }

    .search-row input {
      width: 100%;
      min-width: 0;
      padding: 0.95rem 1rem;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .search-row input:focus {
      border-color: rgba(97, 218, 251, 0.7);
      background: rgba(255, 255, 255, 0.08);
    }

    .search-row button {
      border: none;
      border-radius: 18px;
      padding: 0 1.4rem;
      min-height: 3rem;
      background: linear-gradient(135deg, #61dafb, #4dd0e1);
      color: #0d1f2e;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .search-row button:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 32px rgba(97, 218, 251, 0.18);
    }

    .info {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      color: var(--muted);
      font-size: 0.96rem;
      line-height: 1.5;
    }

    .info strong {
      color: var(--text);
    }

    .browser-shell {
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      background: rgba(6, 11, 20, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: var(--shadow);
    }

    .browser-top {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.95rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff5f57;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
    }

    .dot:nth-child(2) { background: #ffbd2e; }

    .dot:nth-child(3) { background: #27c93f; }

    .address-bar {
      flex: 1;
      min-width: 0;
      padding: 0.65rem 1rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 0.95rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .proxy-frame {
      width: 100%;
      min-height: 72vh;
      border: none;
      display: block;
      background: #0b1220;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(11, 18, 32, 0.6);
      color: white;
      font-size: 0.98rem;
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .loading-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .spinner {
      width: 3rem;
      height: 3rem;
      border: 4px solid rgba(255,255,255,0.16);
      border-top-color: rgba(97,218,251,0.95);
      border-radius: 50%;
      animation: spin 1.1s linear infinite;
      margin-bottom: 0.85rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 720px) {
      header {
        padding: 1rem;
      }
      .search-row {
        grid-template-columns: 1fr;
      }
      .search-row button {
        width: 100%;
      }
      .browser-top {
        flex-wrap: wrap;
      }
      .address-bar {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="brand">
        <strong>MUSABX Proxy</strong>
        <span>Fast one-tab browsing with DuckDuckGo inside one window.</span>
      </div>

      <div class="search-group">
        <form id="searchForm" class="search-row" autocomplete="off">
          <input id="searchInput" type="search" name="q" placeholder="Search or type a website, e.g. youtube.com" spellcheck="false" />
          <button type="submit">Search</button>
        </form>
        <div class="info">
          <span><strong>One tab only:</strong> all searches and clicks stay inside the page.</span>
          <span><strong>DuckDuckGo Lite:</strong> clean search with fast loading.</span>
        </div>
      </div>
    </header>

    <section class="browser-shell">
      <div class="browser-top">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div id="addressBar" class="address-bar">Ready for MUSABX search</div>
      </div>
      <div class="loading-overlay" id="loader">
        <div class="spinner"></div>
        <div>Loading inside MUSABX...</div>
      </div>
      <iframe id="proxyFrame" class="proxy-frame" sandbox="allow-scripts allow-same-origin allow-forms" srcdoc="<div style='font-family:Inter,system-ui,sans-serif;color:#eef5ff;background:#0b1220;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.5rem;'><h1 style='margin:0;font-size:2.25rem;color:#61dafb;'>MUSABX</h1><p style='margin:1rem 0 0;color:#a6b8d7;max-width:28rem;'>Type your query above and hit Search. DuckDuckGo Lite will load inside this page so results stay in one tab.</p></div>" title="MUSABX Proxy Frame"></iframe>
    </section>
  </div>

  <script>
    const form = document.getElementById('searchForm');
    const input = document.getElementById('searchInput');
    const frame = document.getElementById('proxyFrame');
    const addressBar = document.getElementById('addressBar');
    const loader = document.getElementById('loader');

    function cleanQuery(value) {
      if (!value) return '';
      const trimmed = value.trim();
      if (trimmed.match(/^https?:\/\//i)) {
        return trimmed;
      }
      return trimmed;
    }

    function buildDuckDuckGoUrl(query) {
      const normalized = query.trim();
      const isUrl = /^(?:https?:\/\/)?[\w-]+(?:\.[\w-]+)+.*$/.test(normalized);
      if (isUrl && normalized.includes('.') && !normalized.includes(' ')) {
        const url = normalized.startsWith('http') ? normalized : 'https://' + normalized;
        return 'https://lite.duckduckgo.com/lite/?q=' + encodeURIComponent(url);
      }
      return 'https://lite.duckduckgo.com/lite/?q=' + encodeURIComponent(normalized);
    }

    function showLoader(active) {
      loader.classList.toggle('active', active);
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const query = cleanQuery(input.value);
      if (!query) return;
      const targetUrl = buildDuckDuckGoUrl(query);
      frame.src = targetUrl;
      addressBar.textContent = targetUrl;
      showLoader(true);
    });

    frame.addEventListener('load', () => {
      showLoader(false);
      const url = frame.src || 'DuckDuckGo Lite ready';
      addressBar.textContent = url;
    });

    input.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        form.dispatchEvent(new Event('submit', { cancelable: true }));
      }
    });
  </script>
</body>
</html>
