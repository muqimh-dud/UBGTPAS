```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#050816">

  <title>MUSABX Browser</title>

  <style>
    :root {
      --bg: #050816;
      --panel: rgba(12, 19, 39, 0.92);
      --panel-light: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f5f7ff;
      --muted: #9ca9c9;
      --accent: #61dafb;
      --accent2: #7c5cff;
      --danger: #ff5f57;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(
          circle at top left,
          rgba(97, 218, 251, 0.14),
          transparent 30%
        ),
        var(--bg);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* APP */

    .browser-app {
      width: 100%;
      height: 100vh;

      display: grid;
      grid-template-rows: auto auto 1fr;

      background: var(--bg);
    }

    /* TOP */

    .browser-header {
      display: flex;
      align-items: center;
      gap: 10px;

      padding: 10px;

      border-bottom: 1px solid var(--border);

      background: var(--panel);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .home-button,
    .fullscreen-button {
      width: 42px;
      height: 42px;

      flex: 0 0 auto;

      display: grid;
      place-items: center;

      border: 1px solid var(--border);
      border-radius: 13px;

      background: var(--panel-light);
      color: var(--text);

      font-size: 18px;
    }

    .home-button:hover,
    .fullscreen-button:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .address-form {
      flex: 1;

      display: flex;
      gap: 7px;

      min-width: 0;
    }

    .address-input {
      width: 100%;
      min-width: 0;

      padding: 11px 15px;

      border: 1px solid var(--border);
      border-radius: 14px;

      outline: none;

      background: rgba(255, 255, 255, 0.05);
      color: var(--text);

      font-size: 14px;
    }

    .address-input:focus {
      border-color:
        rgba(97, 218, 251, 0.6);
    }

    .go-button {
      min-width: 52px;

      border: 0;
      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          #4dd0e1
        );

      color: #06101d;
      font-weight: 800;
    }

    /* TABS */

    .tabs-bar {
      display: flex;
      align-items: center;
      gap: 7px;

      min-width: 0;

      padding: 8px;

      overflow-x: auto;

      border-bottom: 1px solid var(--border);

      background:
        rgba(6, 11, 25, 0.95);
    }

    .tabs-bar::-webkit-scrollbar {
      height: 4px;
    }

    .tab {
      min-width: 150px;
      max-width: 220px;

      display: flex;
      align-items: center;
      gap: 7px;

      padding: 9px 10px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: rgba(255, 255, 255, 0.04);

      color: var(--muted);

      white-space: nowrap;

      cursor: pointer;
    }

    .tab.active {
      background:
        rgba(97, 218, 251, 0.1);

      border-color:
        rgba(97, 218, 251, 0.35);

      color: var(--text);
    }

    .tab-title {
      overflow: hidden;

      text-overflow: ellipsis;
    }

    .tab-close {
      margin-left: auto;

      width: 22px;
      height: 22px;

      border: 0;
      border-radius: 7px;

      background: transparent;

      color: var(--muted);
    }

    .tab-close:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .new-tab {
      flex: 0 0 auto;

      width: 38px;
      height: 38px;

      border: 1px solid var(--border);
      border-radius: 11px;

      background: var(--panel-light);
      color: white;

      font-size: 20px;
    }

    /* CONTENT */

    .browser-content {
      position: relative;

      min-height: 0;

      background: #080d1c;
    }

    .browser-frame {
      width: 100%;
      height: 100%;

      display: block;

      border: 0;

      background: white;
    }

    /* LOADING */

    .loading {
      position: absolute;
      inset: 0;

      display: none;
      place-items: center;

      background:
        rgba(5, 8, 22, 0.75);

      backdrop-filter: blur(5px);

      z-index: 20;
    }

    .loading.active {
      display: grid;
    }

    .loading-box {
      padding: 22px;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: var(--panel);

      text-align: center;
    }

    .spinner {
      width: 34px;
      height: 34px;

      margin: 0 auto 12px;

      border: 4px solid
        rgba(255, 255, 255, 0.12);

      border-top-color: var(--accent);

      border-radius: 50%;

      animation:
        spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* FULLSCREEN */

    body.fullscreen .browser-header,
    body.fullscreen .tabs-bar {
      display: none;
    }

    body.fullscreen .browser-app {
      grid-template-rows: 1fr;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .browser-header {
        padding: 7px;
        gap: 6px;
      }

      .home-button,
      .fullscreen-button {
        width: 38px;
        height: 38px;
      }

      .address-input {
        padding: 10px 11px;
        font-size: 13px;
      }

      .go-button {
        min-width: 45px;
      }

      .tab {
        min-width: 125px;
        max-width: 170px;

        padding: 8px;
      }

      .tabs-bar {
        padding: 6px;
      }

    }
  </style>
</head>

<body>

  <div class="browser-app">

    <!-- BROWSER CONTROLS -->

    <header class="browser-header">

      <button
        class="home-button"
        id="homeButton"
        type="button"
        title="MUSABX Home"
      >
        ⌂
      </button>

      <form
        class="address-form"
        id="addressForm"
        autocomplete="off"
      >

        <input
          id="addressInput"
          class="address-input"
          type="text"
          placeholder="Search DuckDuckGo or enter a website..."
          spellcheck="false"
          autocomplete="off"
        >

        <button
          class="go-button"
          type="submit"
        >
          Go
        </button>

      </form>

      <button
        class="fullscreen-button"
        id="fullscreenButton"
        type="button"
        title="Fullscreen"
      >
        ⛶
      </button>

    </header>


    <!-- INTERNAL TABS -->

    <div
      class="tabs-bar"
      id="tabsBar"
    >

      <button
        class="new-tab"
        id="newTabButton"
        type="button"
        title="New tab"
      >
        +
      </button>

    </div>


    <!-- WEBSITE AREA -->

    <main class="browser-content">

      <iframe
        id="browserFrame"
        class="browser-frame"
        title="MUSABX Browser"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
      ></iframe>


      <div
        class="loading"
        id="loading"
      >

        <div class="loading-box">

          <div class="spinner"></div>

          <div>
            Loading MUSABX...
          </div>

        </div>

      </div>

    </main>

  </div>


  <script src="browser.js"></script>

</body>
</html>
```
